[package]
name = "shred-core"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
pcap = { version = "2.5.0", optional = true }
reed-solomon-erasure = "6.0.0"
serde = { version = "1.0.229", features = ["serde_derive"], optional = true }
sha2 = "0.10.9"
solana-address = { version = "2.9.0", default-features = false, features = ["decode"] }
solana-hash = { version = "4.7.0", features = ["wincode"] }
solana-signature = { version = "3.6.0", features = ["verify"] }
solana-transaction = { version = "5.1.0", features = ["wincode"] }
thiserror = "2.0.21"
wincode = "0.6.2"

[features]
default = ["assembler", "footer", "pcap"]
# the slot assembler, shreds in, transactions, markers and closed slots out
assembler = ["footer"]
# the Alpenglow block footer decoder, its signer bitmaps serialize with serde
footer = ["dep:serde"]
# the pcap capture file reader
pcap = []
# live capture from a network interface, needs libpcap to build
live = ["pcap", "dep:pcap"]
